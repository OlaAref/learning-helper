# Two throwaway PostgreSQL servers for the labs.
#  - lab-pg:   normal tasks (SQL and concurrency)
#  - crash-pg: crash tasks; the app runs `docker kill dblab-crash` / `docker start dblab-crash` on it
name: learning-helper
services:
  lab-pg:
    image: postgres:16
    container_name: dblab-pg
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  crash-pg:
    image: postgres:16
    container_name: dblab-crash
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    restart: "no"          # a killed server must stay down until the learner starts it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
