id: t2-serializable-detects-it
title: Serializable catches it, then retry
kind: concurrency
difficulty: hard
sessions: [A, B]
statement: |
  Same table (`a, a, b, b`), same two transactions, but at **SERIALIZABLE**.

  1. **A:** `BEGIN ISOLATION LEVEL SERIALIZABLE;` then `UPDATE t SET f = 'b' WHERE f = 'a';`
  2. **B:** `BEGIN ISOLATION LEVEL SERIALIZABLE;` then `UPDATE t SET f = 'a' WHERE f = 'b';`
  3. **A:** `COMMIT;` (works). **B:** `COMMIT;` fails with a serialization error (SQLSTATE **40001**).
  4. **Retry B** from the start: a new serializable transaction with the same update, then commit.

  The table must end up with a single value in every row.
setup: |
  CREATE TABLE t (id serial PRIMARY KEY, f text);
  INSERT INTO t(f) VALUES ('a'), ('a'), ('b'), ('b');
hints:
  - "A failed COMMIT already ended B's transaction, so there is nothing to roll back before retrying."
checks:
  - type: error
    description: A statement failed with serialization failure 40001
    sqlstate: "40001"
  - type: query
    description: After the retry all rows hold the same value
    sql: SELECT count(DISTINCT f) FROM t
    expect: [[1]]
  - type: query
    description: No transaction is left open
    sql: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND state LIKE 'idle in transaction%'
    expect: [[0]]
solution:
  explanation: PostgreSQL tracked the read/write dependencies and refused the second commit. The retry sees A's committed result and produces a valid serial outcome.
  steps:
    - session: A
      sql: |
        BEGIN ISOLATION LEVEL SERIALIZABLE;
        UPDATE t SET f = 'b' WHERE f = 'a';
    - session: B
      sql: |
        BEGIN ISOLATION LEVEL SERIALIZABLE;
        UPDATE t SET f = 'a' WHERE f = 'b';
    - session: A
      sql: COMMIT;
    - session: B
      sql: COMMIT;
    - session: B
      sql: |
        BEGIN ISOLATION LEVEL SERIALIZABLE;
        UPDATE t SET f = 'a' WHERE f = 'b';
        COMMIT;
