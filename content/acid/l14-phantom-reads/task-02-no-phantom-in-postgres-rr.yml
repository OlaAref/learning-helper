id: t2-no-phantom-in-postgres-rr
title: Block the phantom with Repeatable Read
kind: concurrency
difficulty: medium
sessions: [A, B]
statement: |
  Repeat the scenario with the right isolation level so A's count stays the same.

  1. **A:** `BEGIN ISOLATION LEVEL REPEATABLE READ;` then `SELECT count(*) FROM sales WHERE qty >= 10;` (2).
  2. **B:** `INSERT INTO sales VALUES (3, 10, 10);`
  3. **A:** the same count: still **2**. `COMMIT;`.

  The row really exists (committed count is 3); A just never sees it.
setup: |
  CREATE TABLE sales (pid int PRIMARY KEY, qty int, price int);
  INSERT INTO sales VALUES (1, 10, 5), (2, 20, 4);
checks:
  - type: result
    description: First count is 2
    session: A
    nth: "1"
    expect: [[2]]
  - type: result
    description: Second count is still 2
    session: A
    nth: "2"
    expect: [[2]]
  - type: query
    description: B's insert was committed (3 matching rows)
    sql: SELECT count(*) FROM sales WHERE qty >= 10
    expect: [[3]]
  - type: query
    description: No transaction is left open
    sql: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND state LIKE 'idle in transaction%'
    expect: [[0]]
solution:
  explanation: "The SQL standard allows phantoms at Repeatable Read, but PostgreSQL's Repeatable Read is snapshot isolation, so rows inserted later are invisible."
  steps:
    - session: A
      sql: |
        BEGIN ISOLATION LEVEL REPEATABLE READ;
        SELECT count(*) FROM sales WHERE qty >= 10;
    - session: B
      sql: INSERT INTO sales VALUES (3, 10, 10);
    - session: A
      sql: SELECT count(*) FROM sales WHERE qty >= 10;
    - session: A
      sql: COMMIT;
