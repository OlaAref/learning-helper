id: t5-fix-lost-update
title: Fix the lost update with a row lock
kind: concurrency
difficulty: hard
sessions: [A, B]
statement: |
  Same goal: qty 10, A adds 10, B adds 5, the final value must be **25**. This time lock the row with `SELECT ... FOR UPDATE`.

  1. **A:** `BEGIN;` then `SELECT qty FROM sales WHERE pid = 1 FOR UPDATE;` (10).
  2. **B:** `BEGIN;` then the same `FOR UPDATE` select. It **waits**: the terminal shows it as running.
  3. **A:** `UPDATE sales SET qty = 20 WHERE pid = 1;` then `COMMIT;`. B's SELECT now finishes and returns **20**.
  4. **B:** `UPDATE sales SET qty = 25 WHERE pid = 1;` then `COMMIT;`.
setup: |
  CREATE TABLE sales (pid int PRIMARY KEY, qty int, price int);
  INSERT INTO sales VALUES (1, 10, 5), (2, 20, 4);
hints:
  - "Send B's blocked statement and just carry on in A; you do not need to wait for it."
checks:
  - type: result
    description: B's locked SELECT returned 20 (it waited for A)
    session: B
    nth: "1"
    expect: [[20]]
  - type: query
    description: Final qty is 25, nothing was lost
    sql: SELECT qty FROM sales WHERE pid = 1
    expect: [[25]]
  - type: query
    description: No transaction is left open
    sql: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND state LIKE 'idle in transaction%'
    expect: [[0]]
solution:
  explanation: The row lock serializes the two read-modify-write cycles, so B reads A's committed value. An atomic "UPDATE ... SET qty = qty + 5" would avoid the problem without a separate read.
  steps:
    - session: A
      sql: |
        BEGIN;
        SELECT qty FROM sales WHERE pid = 1 FOR UPDATE;
    - session: B
      sql: |
        BEGIN;
        SELECT qty FROM sales WHERE pid = 1 FOR UPDATE;
    - session: A
      sql: |
        UPDATE sales SET qty = 20 WHERE pid = 1;
        COMMIT;
    - session: B
      sql: |
        UPDATE sales SET qty = 25 WHERE pid = 1;
        COMMIT;
