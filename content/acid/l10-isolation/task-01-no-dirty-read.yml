id: t1-no-dirty-read
title: Try (and fail) to read dirty data
kind: concurrency
difficulty: easy
sessions: [A, B]
statement: |
  Two terminals, A and B, share the `sales` table (product 1 has qty 10).

  1. **A:** `BEGIN`, then `UPDATE sales SET qty = 15 WHERE pid = 1`. Do not commit.
  2. **B:** ask for the weakest level: `BEGIN TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;` then `SELECT qty FROM sales WHERE pid = 1;` then `COMMIT;`.
  3. **A:** `ROLLBACK`.

  B's SELECT must return **10**: PostgreSQL never shows uncommitted data, even at READ UNCOMMITTED.
setup: |
  CREATE TABLE sales (pid int PRIMARY KEY, qty int, price int);
  INSERT INTO sales VALUES (1, 10, 5), (2, 20, 4);
hints:
  - "B's SELECT result is what the checker reads. Run it while A's transaction is still open."
checks:
  - type: result
    description: B read 10, not the uncommitted 15
    session: B
    nth: "1"
    expect: [[10]]
  - type: query
    description: The committed qty is still 10
    sql: SELECT qty FROM sales WHERE pid = 1
    expect: [[10]]
  - type: query
    description: No transaction is left open
    sql: SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND state LIKE 'idle in transaction%'
    expect: [[0]]
solution:
  explanation: PostgreSQL accepts READ UNCOMMITTED but treats it as READ COMMITTED, so a dirty read is impossible.
  steps:
    - session: A
      sql: |
        BEGIN;
        UPDATE sales SET qty = 15 WHERE pid = 1;
    - session: B
      sql: |
        BEGIN TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;
        SELECT qty FROM sales WHERE pid = 1;
        COMMIT;
    - session: A
      sql: ROLLBACK;
